[package]
name = "sora"
version = "0.1.1"
description = "Sora desktop"
authors = ["sora"]
edition = "2021"

[lib]
name = "sora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
