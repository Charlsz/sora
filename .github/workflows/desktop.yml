name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Draft releases need contents:write. Default GITHUB_TOKEN is often read-only.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Test
        run: bun test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: bun install
      - name: Build sidecar
        run: bun scripts/build-sidecar.ts
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Build Tauri (Windows)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          includeUpdaterJson: false
      - name: Build + draft release (Windows)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          includeUpdaterJson: false
          tagName: ${{ github.ref_name }}
          releaseName: Sora ${{ github.ref_name }}
          releaseDraft: true

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install
      - name: Build sidecar
        run: bun scripts/build-sidecar.ts
      # Unsigned builds only. Do not set APPLE_* here — empty secret values still
      # make tauri-action attempt keychain import and fail codesign. Add a signed
      # step (with real APPLE_* secrets) when Developer ID certs are available.
      - name: Build Tauri (macOS)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --bundles dmg,app
          includeUpdaterJson: false
      - name: Build + draft release (macOS)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --bundles dmg,app
          includeUpdaterJson: false
          tagName: ${{ github.ref_name }}
          releaseName: Sora ${{ github.ref_name }}
          releaseDraft: true
